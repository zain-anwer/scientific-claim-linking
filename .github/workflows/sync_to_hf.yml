name: Sync Backend to HuggingFace Space

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v4        # updated from v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Push backend subfolder to HuggingFace Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cd backend
          git init
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git remote add hf https://ze19n:$HF_TOKEN@huggingface.co/spaces/ze19n/scientific-claim-linking-backend
          git add .
          git commit -m "sync from github"
          git push hf HEAD:main --force