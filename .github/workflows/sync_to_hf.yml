name: Sync Backend to HuggingFace Space

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push backend subfolder to HuggingFace Space
        run: |
          # 1. Navigate into the backend directory
          cd backend
          
          # 2. Initialize a clean repository explicitly named 'main'
          git init -b main
          
          # 3. Configure Git credentials locally inside this directory
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          
          # 4. Link the Hugging Face remote securely using native GitHub secrets token injection
          git remote add hf https://ze19n:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/ze19n/scientific-claim-linking-backend
          
          # 5. Stage, commit, and force-push to the Space
          git add .
          git commit -m "sync from github"
          git push hf main --force