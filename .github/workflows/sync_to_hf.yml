name: Sync Backend to HuggingFace Space

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      # This marketplace action handles all the complicated LFS handshake logic cleanly
      - name: Push backend subfolder to HuggingFace Space
        uses: CustomInk/huggingface-spaces-upload-action@v2
        with:
          hf_token: ${{ secrets.HF_TOKEN }}
          hf_username: "ze19n"
          space_name: "scientific-claim-linking-backend"
          space_directory: "./backend"